name: 'amazee.ai - Try Compliance Checks with DrupalAI'
type: Site
description: Drupal CMS (starter) plus the amazee.ai compliance demo — AI automators review content against compliance rules and suggest fixes.
recipes:
  - drupal_cms_starter
install:
  - ai
  - ai_provider_amazeeio
  - ai_automators
config:
  strict: false
  actions:
    ai.settings:
      simpleConfigUpdate:
        default_providers:
          chat:
            provider_id: amazeeio
            model_id: chat
          chat_with_complex_json:
            provider_id: amazeeio
            model_id: chat_with_complex_json
          chat_with_image_vision:
            provider_id: amazeeio
            model_id: chat_with_image_vision
          embeddings:
            provider_id: amazeeio
            model_id: embeddings
    editor.editor.content_format:
      simpleConfigUpdate:
        settings.toolbar.items:
          - heading
          - bold
          - italic
          - strikethrough
          - blockQuote
          - link
          - bulletedList
          - numberedList
          - indent
          - outdent
          - alignment
          - insertTable
          - drupalMedia
          - undo
          - redo
          - removeFormat
          - sourceEditing
    filter.format.content_format:
      simpleConfigUpdate:
        filters.filter_html.settings.allowed_html: '<br> <p class="text-align-left text-align-center text-align-right text-align-justify"> <h2 class="text-align-left text-align-center text-align-right text-align-justify"> <h3 class="text-align-left text-align-center text-align-right text-align-justify"> <h4 class="text-align-left text-align-center text-align-right text-align-justify"> <h5 class="text-align-left text-align-center text-align-right text-align-justify"> <h6 class="text-align-left text-align-center text-align-right text-align-justify"> <strong> <em> <s> <blockquote> <a href data-entity-type data-entity-uuid data-entity-substitution> <ul> <ol reversed start> <li> <table> <tr> <td rowspan colspan> <th rowspan colspan> <thead> <tbody> <tfoot> <caption> <drupal-media data-entity-type data-entity-uuid alt data-view-mode data-caption data-align>'
    system.site:
      simpleConfigUpdate:
        page:
          front: /instructions
